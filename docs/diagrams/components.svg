<title id="title">Component dependencies</title><desc id="desc">Main uses model setup, the task ledger, and the agents. The agents use shared contracts, graph and note tools; Meti uses the Docker runner. This is a simplified view of runtime dependencies, not an exhaustive import graph.</desc>
