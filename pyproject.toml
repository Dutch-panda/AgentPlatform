[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "buildrelay"
version = "0.1.0"
description = "An AI development team that plans, builds, and checks your code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-ai>=2.57.0",
    "docker>=7.0.0",
    "graphifyy>=0.7.14",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
buildrelay = "main:cli_entrypoint"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["agents", "tools", "contracts"]
