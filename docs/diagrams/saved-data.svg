<svg xmlns="http://www.w3.org/2000/svg" width="760" height="384" viewBox="0 0 760 384" role="img" aria-labelledby="title desc">
<title id="title">Saved data connections</title><desc id="desc">Stage notes link to an optional shared project note and can be extracted into a Graphify graph for agent queries. The SQLite ledger saves progress for resume. Docker writes generated code to the project or standalone task workspace.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#b8b0a4"/></marker></defs>
<rect width="760" height="384" rx="12" fill="#151514"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#f2eee7;font-size:18px}.sub{fill:#bbb4aa;font-size:15px}.accent{fill:#ffac75}.line{fill:none;stroke:#b8b0a4;stroke-width:1.6;marker-end:url(#arrow)}.box{fill:#23221f;stroke:#565048;stroke-width:1}</style>
<rect class="box" x="28" y="24" width="224" height="90" rx="7"/>
<text x="140.0" y="48.0" text-anchor="middle">Stage notes</text>
<text class="sub" x="140" y="73" text-anchor="middle">Briefs · Research</text>
<text class="sub" x="140" y="96" text-anchor="middle">Specs · Reviews</text>
<rect class="box" x="340" y="24" width="390" height="90" rx="7"/>
<text x="535.0" y="66.0" text-anchor="middle">Shared project note</text>
<text class="sub" x="535.0" y="89.0" text-anchor="middle">vault/projects/&lt;project_id&gt;.md</text>
<path class="line" d="M252 69 H340"/>
<text class="sub" x="295" y="55" text-anchor="middle">link to</text>
<rect class="box" x="28" y="138" width="224" height="66" rx="7"/>
<text x="140.0" y="168.0" text-anchor="middle">Graphify graph</text>
<text class="sub" x="140.0" y="191.0" text-anchor="middle">When extraction is available</text>
<rect class="box" x="340" y="138" width="390" height="66" rx="7"/>
<text x="535.0" y="168.0" text-anchor="middle">Agent context</text>
<text class="sub" x="535.0" y="191.0" text-anchor="middle">Node search and related notes</text>
<path class="line" d="M140 114 V138"/>
<path class="line" d="M252 171 H340"/>
<rect class="box" x="28" y="270" width="224" height="66" rx="7"/>
<text x="140.0" y="300.0" text-anchor="middle" class="accent">SQLite ledger</text>
<text class="sub" x="140.0" y="323.0" text-anchor="middle">.state/tasks.db</text>
<rect class="box" x="340" y="270" width="390" height="66" rx="7"/>
<text x="535.0" y="300.0" text-anchor="middle">Resume</text>
<text class="sub" x="535.0" y="323.0" text-anchor="middle">Saved stages and validated phases</text>
<path class="line" d="M252 303 H340"/>
<text class="sub" x="380" y="367" text-anchor="middle">Generated code: Docker → workspace/&lt;project_id or task_id&gt;/</text>
</svg>
